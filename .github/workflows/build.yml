name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev libffi-dev libssl-dev libltdl-dev lld cmake

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cython<3.0.0" buildozer

      - name: Clear Corrupted Buildozer Cache
        run: |
          rm -rf .buildozer
          rm -rf bin
          rm -rf ~/.buildozer

      - name: Overwrite Host Python Paths & Build
        run: |
          # 1. Locate exactly where our safe Python 3.11 executable is hidden
          SAFE_PYTHON=$(which python)
          
          # 2. Force create a local bin override path to strip the runner's Python 3.14 alias
          mkdir -p $HOME/.local/bin
          ln -sf $SAFE_PYTHON $HOME/.local/bin/python3
          ln -sf $SAFE_PYTHON $HOME/.local/bin/python
          
          # 3. Inject our safe override directly into the front of the PATH variable
          export PATH=$HOME/.local/bin:$PATH
          
          # 4. Verify that 'python3' now points directly to 3.11 matching host python
          python3 --version
          
          # 5. Kick off build completely isolated from the system's experimental python
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | buildozer -v android debug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: bin/*.apk
          if-no-files-found: error
